[Database]
DatabaseFile                    = ./virtuoso.db
ErrorLogFile                    = ./virtuoso.log
LockFile                        = ./virtuoso.lck
TransactionFile                 = ./virtuoso.trx
xa_persistent_file              = ./virtuoso.pxa
ErrorLogLevel                   = 7
FileExtend                      = 200
MaxCheckpointRemap              = 0

[TempDatabase]
DatabaseFile                    = ./virtuoso-temp.db
TransactionFile                 = ./virtuoso-temp.trx
MaxCheckpointRemap              = 0

[Parameters]
MaxClientConnections            = 10
CheckpointInterval              = 0
CaseMode                        = 2
DirsAllowed                     = .,/home
ThreadCleanupInterval           = 0
ResourcesCleanupInterval        = 0
FreeTextBatchSize               = 100000
PrefixResultNames               = 0
IndexTreeMaps                   = 256
MaxMemPoolSize                  = 1000000000
TransactionAfterImageLimit      = 4000000000
MaxQueryMem                     = 16G
DefaultIsolation                = 2
VectorSize                      = 10000
MaxVectorSize                   = 1000000
AdjustVectorSize                = 1
ThreadsPerQuery                 = 1
AsyncQueueMaxThreads            = 11
; pages of 8 KB, 64 GB of the 128 GB of the machine, so that MaxQueryMem and tn_max_memory fit beside them
NumberOfBuffers                 = 8000000
MaxDirtyBuffers                 = 6000000
EnableMonitor                   = 0

[HTTPServer]
ServerPort                      = 8080
MaxClientConnections            = 10
ServerThreads                   = 10
Charset                         = UTF-8

[Client]
SQL_PREFETCH_ROWS               = 100
SQL_PREFETCH_BYTES              = 16000
SQL_QUERY_TIMEOUT               = 0
SQL_TXN_TIMEOUT                 = 0

[SPARQL]
MaxQueryExecutionTime           = 1000

[Flags]
hash_join_enable                = 2
enable_exact_p_stat             = 1
qp_thread_min_usec              = 100
enable_sparql_count_distinct_dt = 1
enable_sparql_sample_min        = 1
enable_mt_txn                   = 1
enable_mt_transact              = 1
; the memory for a transitive subquery and for the hash tables of hash joins, of which one gets half before it is
; partitioned; HashJoinSpace of [Parameters] sets no more than 10 MB for the latter, as it takes MIN (value, 10000000)
tn_max_memory                   = 24G
chash_space_avail               = 16G
